# TODO: remove this file

[loggers]
keys=root,nds.benchmark,nds.engine,nds.plugins,nds.spec,nds.worker

[handlers]
keys=consoleHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler

[logger_nds.benchmark]
level=DEBUG
handlers=consoleHandler
qualname=nds.benchmark
propagate=0


[logger_nds.engine]
level=INFO
handlers=consoleHandler
qualname=nds.engine
propagate=0

[logger_nds.spec]
level=INFO
handlers=consoleHandler
qualname=nds.spec
propagate=0

[logger_nds.plugins]
level=INFO
handlers=consoleHandler
qualname=nds.plugins
propagate=0

[logger_nds.worker]
level=DEBUG
handlers=consoleHandler
qualname=nds.worker
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=simpleFormatter
args=(sys.stdout,)

[formatter_simpleFormatter]
format=%(asctime)s | %(name)s:%(levelname)s - %(message)s