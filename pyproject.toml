[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nodeblocks"
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "packaging>=26.3",
    "aiohttp>=3.13.5",
    "aiohttp_cors>=0.8.1",
    "pydantic>=2.13.3",
    "PyJWT>=2.12.1",
    "pydantic-settings>=2.16.2",
    "protobuf>=7.36.2",
    "numpy>=2.5.4",
    "uv>=0.13.7",
    "platformdirs>=2.14.5",
    "filelock>=4.2.9"
]

[project.scripts]
nodeblocks = "nodeblocks.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy-protobuf>=5.1.0"
]

[tool.pytest]
pythonpath = ["src"]
testpaths = ["tests/nodeblocks"] 
addopts = [
    "--import-mode=importlib",
]

log_cli = true
log_cli_level = "INFO"


[tool.setuptools.packages.find]
where=["src"]
