[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nodeserver"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "packaging>=26.3",
    "aiohttp>=3.13.5",
    "aiohttp_cors>=0.8.1",
    "multidict>=6.7.1",
    "pydantic>=2.13.3",
    "PyJWT>=2.12.1",
    "python-dotenv>=1.2.2",
    "watchdog>=6.0.0"
]

[project.scripts]
nodeserver = "nodeserver.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest]
pythonpath = ["src"]
testpaths = ["tests/nodeserver"] 
addopts = [
    "--import-mode=importlib",
]

log_cli = true
log_cli_level = "INFO"


[tool.setuptools.packages.find]
where=["src"]
