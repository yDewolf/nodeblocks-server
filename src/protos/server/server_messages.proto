syntax = "proto3";

package nodeblocks.api.v1;
import "server/worker_messages.proto";
import "server/command_responses.proto";
import "server/engine_messages.proto";

message ServerMessageWrapper {
    oneof message {
        nodeblocks.api.v1.WorkerEventMessage worker_event = 1;
        nodeblocks.api.v1.ServerCmdResponseMessage cmd_response = 2;
        nodeblocks.api.v1.EngineEventMessage engine_event = 3;
    }
}

message ServerBatchMessage {
    repeated ServerMessageWrapper messages = 1;
}
