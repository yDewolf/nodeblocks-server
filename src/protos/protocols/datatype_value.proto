syntax = "proto3";

package nodeblocks.protocols.v1.data;

message ArrayMetadataMessage {
    repeated int64 shape = 1;
    optional float min = 2;
    optional float max = 3;
}

message FileMetadataMessage {
    bool is_artifact = 1;
}

message ValueMetadataMessage {
    // TODO: talvez converter o DefaultDataTypes para int e implementar um enum aqui
    string type = 1;
    
    oneof metadata_payload {
        ArrayMetadataMessage array_metadata = 2;
        FileMetadataMessage file_metadata = 3;
    }
}

message SerializedValueMessage {
    oneof value {
        string string_value = 1;
        int64 int_value = 2;
        double float_value = 3;
        bool bool_value = 4;
        string json_serialized_value = 5;
    }
}

message SerializedDataTypeValueMessage {
    SerializedValueMessage value = 1;
    optional ValueMetadataMessage metadata = 2;
}